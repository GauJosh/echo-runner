<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Echo Runner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="roundLine">0m</div>
    <div id="distanceLine">Best: 0m</div>
  </div>

  <div id="milestoneToast"></div>

  <div id="messageOverlay">
    <div id="messageTitle">RUN</div>
    <div id="messageBody"></div>
    <div id="messageHint">Tap to start</div>
  </div>

  <button id="duckButton" class="controlButton" aria-label="Duck">▼</button>
  <button id="jumpButton" class="controlButton" aria-label="Jump">▲</button>

  <script src="main.js"></script>
</body>
</html>
