<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Echo Runner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="roundLine">Round 1</div>
    <div id="distanceLine">Distance: 0m</div>
  </div>

  <div id="messageOverlay">
    <div id="messageTitle">ECHO</div>
    <div id="messageBody">Tap or press SPACE to jump.<br />Survive your own ghosts.</div>
    <div id="messageHint">Tap to start</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
