name: Deploy to GitHub Pages

# Static site, no build step -- copies an explicit allowlist of the actual
# game files into _site/ and publishes just that. (First version tried
# upload-pages-artifact's `exclude` input to keep dev-only files like
# CLAUDE.md off the public site, but that input isn't actually honored by
# the action -- verified it still 200'd after deploy. An explicit allowlist
# is more reliable than an exclude list anyway.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels an in-progress one
# rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir _site
          cp index.html main.js styles.css _site/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
